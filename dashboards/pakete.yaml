swipe_nav:
  wrap: false
  enable_mouse_swipe: true
  animate: swipe
views:
- type: sections
  title: Pakete
  path: pakete
  icon: mdi:package-variant-closed
  max_columns: 4
  badges: []
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      content: '{% from ''pakete.jinja'' import anzahl %}

        <div><div>DEIN LIEFERÜBERBLICK</div><h1>Pakete &amp; Briefe</h1><p>Alles auf einen Blick. Von
        der Ankündigung bis zur Ankunft.</p><div><span>{{ anzahl(''incoming_parcels'') }} unterwegs</span><span>{{
        anzahl(''awaiting_pickup'') }} abholbereit</span><span>{{ (state_attr(''sensor.briefankuendigungen'',''ankuendigungen'')
        or []) | length }} Briefankündigungen</span></div></div>'
      grid_options:
        columns: full
      card_mod:
        style:
          .: 'ha-card{border:1px solid #50bee638;border-radius:20px;background:radial-gradient(ellipse
            at 95% 0%,#7263ef50,transparent 55%),linear-gradient(110deg,#123a4b,#1b3041 55%,#252c46);box-shadow:0
            8px 28px #0002;padding:0 12px;color:#eefaff}'
          ha-markdown$: 'ha-markdown-element > div{padding:12px 10px}ha-markdown-element > div > div:first-child{font-size:11px;letter-spacing:.2em;font-weight:700;color:#83d9ed}h1{font-size:40px
            !important;line-height:1.15 !important;margin:10px 0 !important;font-weight:800 !important;letter-spacing:-.035em}p{font-size:14px;color:#b9ced9;margin:0
            0 22px}ha-markdown-element > div > div:last-child{display:flex;gap:10px;flex-wrap:wrap}span{border:1px
            solid #ffffff20;background:#ffffff0d;border-radius:30px;padding:8px 14px;font-size:12px;font-weight:600}

            ha-markdown-element > div{padding:4px 8px}h1{font-size:29px !important;margin:5px 0 !important}p{margin:0
            0 10px;font-size:12px}span{padding:5px 10px;font-size:11px}ha-markdown-element > div > div:first-child{font-size:10px}'
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Sendungsstatus
      heading_style: title
      icon: mdi:package-variant-closed
      grid_options:
        columns: full
        rows: 1
    - type: markdown
      content: '{% from ''pakete.jinja'' import liste, held, aktiv, zugestellt, ausgehend, dienst_zeile,
        dienst_stand, dienst_zustellung, tabelle, demo %}{{ held() }}'
      card_mod:
        style:
          ha-markdown$: 'ha-markdown-element > div{display:flex;align-items:center;gap:18px;color:#fff}

            ha-markdown-element > div > img{width:76px;height:76px;border-radius:20px;flex:none;box-shadow:0
            6px 18px rgba(0,0,0,.35)}

            ha-markdown-element > div > div:first-child{width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);flex:none}

            ha-markdown-element > div > div:first-child > ha-icon{--mdc-icon-size:42px;color:#fff}

            ha-markdown-element > div > div:last-child{min-width:0}

            ha-markdown-element > div > div:last-child > div:nth-child(1){font-size:12px;letter-spacing:.09em;text-transform:uppercase;opacity:.8;font-weight:600;line-height:18px}

            ha-markdown-element > div > div:last-child > div:nth-child(2){font-size:26px;font-weight:700;line-height:32px;margin:2px
            0}

            ha-markdown-element > div > div:last-child > div:nth-child(3){font-size:14px;opacity:.88;line-height:20px}

            ha-markdown-element > div > div:last-child > div:nth-child(4){display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

            ha-markdown-element > div span{display:inline-flex;align-items:center;gap:4px;padding:3px
            10px;border-radius:999px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap;background:rgba(255,255,255,.18);color:#fff}

            ha-markdown-element > div span > ha-icon{--mdc-icon-size:14px}

            ha-markdown-element > div > a{border-radius:16px !important;margin:8px 0 !important;padding:15px
            !important;background:#ffffff09 !important;box-shadow:none !important}ha-markdown-element
            > div > a:hover{background:#78b4dc17 !important}table{font-variant-numeric:tabular-nums}tbody
            tr:hover{background:#78b4dc0c}

            ha-markdown-element > div > a{padding:10px !important;margin:5px 0 !important;border-radius:12px
            !important}td,th{padding:8px 2px !important}th ha-icon{--mdc-icon-size:18px}td img{width:21px
            !important}'
          .: 'ha-card{background:linear-gradient(135deg,#16324f 0%,#2a5a7a 55%,#4a4380 100%);border:none;box-shadow:0
            8px 24px rgba(0,0,0,.25)}

            ha-card{border-radius:22px;border:1px solid rgba(150,180,210,.13);box-shadow:0 8px 24px #0002;background:linear-gradient(145deg,#ffffff09,#ffffff02),var(--card-background-color);}

            ha-card{border-radius:16px;box-shadow:0 4px 14px #0002}'
