          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+4){background:var(--fc)}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:keyboard-return"]){--fc:#ef5350}

