- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Zustellkalender
    heading_style: title
    icon: mdi:calendar-clock
  - type: calendar
    entities:
    - calendar.parcel_aggregator_deliveries
    - calendar.amazon_germany_zustellungen
    initial_view: listWeek
    grid_options:
      columns: full
  - type: heading
    heading: Automatik
    heading_style: title
    icon: mdi:robot-outline
  - type: tile
    entity: automation.pakete_trackingnummern_aus_e_mails_gls_ups
    name: Mail-Erkennung GLS/UPS
    icon: mdi:email-search-outline
    state_content:
    - state
    - last_triggered
    grid_options:
      columns: 12
  - type: tile
    entity: automation.pakete_zugestellte_sendungen_austragen
    name: Zugestellte austragen
    icon: mdi:broom
    state_content:
    - state
    - last_triggered
    grid_options:
      columns: 12
  - type: heading
    heading: Sendung von Hand hinzufügen
    heading_style: title
    icon: mdi:package-variant-plus
  - type: entities
    entities:
    - entity: input_select.paket_dienst
      name: Paketdienst
    - entity: input_text.paket_trackingnummer
      name: Trackingnummer
    - type: button
      name: Trackingnummer eintragen
      icon: mdi:package-variant-plus
      action_name: Hinzufügen
      tap_action:
        action: perform-action
        perform_action: script.paket_hinzufugen
    grid_options:
      columns: full
  - type: markdown
    content: '**Amazon, DHL und Hermes** finden Sendungen aus deinem Konto von selbst.
      Amazon nimmt keine einzelnen Trackingnummern an. Trage hier nur DHL-/Hermes-Nummern
      ein, die dort nicht auftauchen.


      **GLS und UPS** werden zusätzlich automatisch aus Versandmails erkannt, auch
      bei Amazon-Bestellungen. **DPD** läuft nur über das Konto.'
    card_mod:
      style: 'ha-card{background:none;border:none;box-shadow:none}

        ha-markdown{padding:0 4px !important;font-size:13px;color:var(--secondary-text-color)}'
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Briefankündigungen
    icon: mdi:email-newsletter
    heading_style: subtitle
  - type: markdown
    content: '{% set items = state_attr(''sensor.briefankuendigungen'',''ankuendigungen'')
      or [] %}

      {% if items %}

      **{{ items | length }} Briefankündigungs-Mail{{ ''s'' if items | length != 1
      else '''' }}** in den letzten 7 Tagen

      {% for p in items %}

      - **{{ as_timestamp(p.datum) | timestamp_custom(''%d.%m., %H:%M'') }}** · {{
      p.betreff | e }}

      {% endfor %}

      {% else %}

      Noch keine Briefankündigungen erfasst. Neue Ankündigungs-Mails der Deutschen
      Post erscheinen hier automatisch.

      {% endif %}


      Eine Ankündigung bestätigt keine Zustellung. Eine Mail kann mehrere Briefe ankündigen.'
    grid_options:
      columns: full
  - type: button
    entity: button.briefankuendigungen_leeren
    name: Ankündigungen leeren
    icon: mdi:email-remove-outline
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.briefankuendigungen_leeren
      confirmation:
        text: Gespeicherte Briefankündigungen aus der Anzeige entfernen?
    grid_options:
      columns: full
      rows: 1
