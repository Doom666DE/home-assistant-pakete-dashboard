          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+2){background:var(--fc)}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:alert-circle"]){--fc:#ef5350}

