          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:help-circle-outline"]){--fc:#9aa0a6}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:help-circle-outline"])
          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+1){background:var(--fc)}'
        .: ''
    grid_options:
      columns: full
  - type: heading
    heading: Ausgehende Sendungen
    heading_style: title
    icon: mdi:package-up
    visibility:
    - condition: or
      conditions:
      - condition: numeric_state
        entity: sensor.parcel_aggregator_outgoing_parcels
        above: 0
      - condition: numeric_state
        entity: sensor.parcel_aggregator_outgoing_delivered_parcels
        above: 0
  - type: markdown
    content: '{% from ''pakete.jinja'' import liste, held, aktiv, zugestellt, ausgehend,
