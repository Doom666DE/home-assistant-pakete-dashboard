type: sections
title: Pakete Kopie
path: pakete-kopie
icon: mdi:package-variant-closed
max_columns: 4
badges: []
sections:
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Pakete
    heading_style: title
    icon: mdi:package-variant-closed
  - type: markdown
    content: '{% from ''pakete.jinja'' import liste, held, aktiv, zugestellt, ausgehend,
      dienst_zeile, dienst_stand, dienst_zustellung, tabelle, demo %}{{ held() }}'
    card_mod:
      style:
        ha-markdown$: 'ha-markdown-element > div{display:flex;align-items:center;gap:18px;color:#fff}

          ha-markdown-element > div > img{width:76px;height:76px;border-radius:20px;flex:none;box-shadow:0
          6px 18px rgba(0,0,0,.35)}

          ha-markdown-element > div > div:first-child{width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);flex:none}

          ha-markdown-element > div > div:first-child > ha-icon{--mdc-icon-size:42px;color:#fff}

          ha-markdown-element > div > div:last-child{min-width:0}

          ha-markdown-element > div > div:last-child > div:nth-child(1){font-size:12px;letter-spacing:.09em;text-transform:uppercase;opacity:.8;font-weight:600;line-height:18px}

          ha-markdown-element > div > div:last-child > div:nth-child(2){font-size:26px;font-weight:700;line-height:32px;margin:2px
          0}

          ha-markdown-element > div > div:last-child > div:nth-child(3){font-size:14px;opacity:.88;line-height:20px}

          ha-markdown-element > div > div:last-child > div:nth-child(4){display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

          ha-markdown-element > div span{display:inline-flex;align-items:center;gap:4px;padding:3px
          10px;border-radius:999px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap;background:rgba(255,255,255,.18);color:#fff}

          ha-markdown-element > div span > ha-icon{--mdc-icon-size:14px}'
        .: ha-card{background:linear-gradient(135deg,#16324f 0%,#2a5a7a 55%,#4a4380
          100%);border:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    grid_options:
      columns: full
  - type: custom:mushroom-template-card
    entity: sensor.parcel_aggregator_incoming_parcels
    primary: '{% from ''pakete.jinja'' import anzahl %}{{ anzahl(''incoming_parcels'')
      }}'
    secondary: Unterwegs
    icon: mdi:truck-fast-outline
    icon_color: '{% from ''pakete.jinja'' import anzahl %}{{ ''blue'' if anzahl(''incoming_parcels'')
      | int(0) > 0 else ''disabled'' }}'
    layout: vertical
    tap_action:
      action: navigate
      navigation_path: /config/devices/device/919b2edc10ba11cb8f52a6463d91b716
    card_mod:
      style: ha-card{--card-primary-font-size:24px;--card-primary-line-height:30px;--card-primary-font-weight:700;--card-secondary-font-size:12px}
    grid_options:
      columns: 4
      rows: 2
  - type: custom:mushroom-template-card
    entity: sensor.parcel_aggregator_en_route_to_pickup_point
    primary: '{% from ''pakete.jinja'' import anzahl %}{{ anzahl(''en_route_to_pickup_point'')
      }}'
    secondary: Zum Paketshop
    icon: mdi:map-marker-path
    icon_color: '{% from ''pakete.jinja'' import anzahl %}{{ ''cyan'' if anzahl(''en_route_to_pickup_point'')
      | int(0) > 0 else ''disabled'' }}'
    layout: vertical
    tap_action:
      action: navigate
      navigation_path: /config/devices/device/919b2edc10ba11cb8f52a6463d91b716
    card_mod:
      style: ha-card{--card-primary-font-size:24px;--card-primary-line-height:30px;--card-primary-font-weight:700;--card-secondary-font-size:12px}
    grid_options:
      columns: 4
      rows: 2
  - type: custom:mushroom-template-card
    entity: sensor.parcel_aggregator_awaiting_pickup
    primary: '{% from ''pakete.jinja'' import anzahl %}{{ anzahl(''awaiting_pickup'')
      }}'
    secondary: Abholbereit
    icon: mdi:storefront-outline
    icon_color: '{% from ''pakete.jinja'' import anzahl %}{{ ''purple'' if anzahl(''awaiting_pickup'')
      | int(0) > 0 else ''disabled'' }}'
    layout: vertical
    tap_action:
      action: navigate
      navigation_path: /config/devices/device/919b2edc10ba11cb8f52a6463d91b716
    card_mod:
      style: ha-card{--card-primary-font-size:24px;--card-primary-line-height:30px;--card-primary-font-weight:700;--card-secondary-font-size:12px}
    grid_options:
      columns: 4
      rows: 2
  - type: custom:mushroom-template-card
    entity: sensor.parcel_aggregator_delivered_parcels
    primary: '{% from ''pakete.jinja'' import anzahl %}{{ anzahl(''delivered_parcels'')
      }}'
    secondary: Zugestellt
    icon: mdi:package-variant-closed-check
    icon_color: '{% from ''pakete.jinja'' import anzahl %}{{ ''green'' if anzahl(''delivered_parcels'')
      | int(0) > 0 else ''disabled'' }}'
    layout: vertical
    tap_action:
      action: navigate
      navigation_path: /config/devices/device/919b2edc10ba11cb8f52a6463d91b716
    card_mod:
      style: ha-card{--card-primary-font-size:24px;--card-primary-line-height:30px;--card-primary-font-weight:700;--card-secondary-font-size:12px}
    grid_options:
      columns: 4
      rows: 2
  - type: custom:mushroom-template-card
    entity: sensor.parcel_aggregator_outgoing_parcels
    primary: '{% from ''pakete.jinja'' import anzahl %}{{ anzahl(''outgoing_parcels'')
      }}'
    secondary: Ausgehend
    icon: mdi:package-up
    icon_color: '{% from ''pakete.jinja'' import anzahl %}{{ ''amber'' if anzahl(''outgoing_parcels'')
      | int(0) > 0 else ''disabled'' }}'
    layout: vertical
    tap_action:
      action: navigate
      navigation_path: /config/devices/device/919b2edc10ba11cb8f52a6463d91b716
    card_mod:
      style: ha-card{--card-primary-font-size:24px;--card-primary-line-height:30px;--card-primary-font-weight:700;--card-secondary-font-size:12px}
    grid_options:
      columns: 4
      rows: 2
  - type: custom:mushroom-template-card
    entity: sensor.parcel_aggregator_outgoing_delivered_parcels
    primary: '{% from ''pakete.jinja'' import anzahl %}{{ anzahl(''outgoing_delivered_parcels'')
      }}'
    secondary: Angekommen
    icon: mdi:check-all
    icon_color: '{% from ''pakete.jinja'' import anzahl %}{{ ''teal'' if anzahl(''outgoing_delivered_parcels'')
      | int(0) > 0 else ''disabled'' }}'
    layout: vertical
    tap_action:
      action: navigate
      navigation_path: /config/devices/device/919b2edc10ba11cb8f52a6463d91b716
    card_mod:
      style: ha-card{--card-primary-font-size:24px;--card-primary-line-height:30px;--card-primary-font-weight:700;--card-secondary-font-size:12px}
    grid_options:
      columns: 4
      rows: 2
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Aktive Sendungen
    heading_style: title
    icon: mdi:truck-fast-outline
  - type: markdown
    content: '{% from ''pakete.jinja'' import liste, held, aktiv, zugestellt, ausgehend,
      dienst_zeile, dienst_stand, dienst_zustellung, tabelle, demo %}{{ aktiv() }}'
    card_mod:
      style:
        ha-markdown$: 'ha-markdown-element > div{display:flex;flex-direction:column;gap:8px}

          ha-markdown-element > div > a{--fc:#9aa0a6;display:flex;align-items:center;gap:12px;padding:10px
          12px;border-radius:14px;background:rgba(var(--rgb-primary-text-color),0.05);text-decoration:none;color:var(--primary-text-color);border-left:4px
          solid var(--fc)}

          ha-markdown-element > div > a > img{width:40px;height:40px;border-radius:10px;flex:none}

          ha-markdown-element > div > a > div:nth-of-type(1){flex:1;min-width:0}

          ha-markdown-element > div > a > div:nth-of-type(1) > div{font-size:12px;line-height:17px;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

          ha-markdown-element > div > a > div:nth-of-type(1) > div:first-child{font-weight:600;font-size:15px;line-height:20px;color:var(--primary-text-color)}

          ha-markdown-element > div > a > div:nth-of-type(1) > div > span{font-family:var(--code-font-family,monospace);font-size:11px}

          ha-markdown-element > div > a > div:nth-of-type(1) > div > ha-icon{--mdc-icon-size:14px;margin-right:4px;vertical-align:-2px}

          ha-markdown-element > div > a > div:nth-of-type(1) > div:last-child{display:flex;gap:4px;margin-top:7px;max-width:220px}

          ha-markdown-element > div > a > div:nth-of-type(1) > div:last-child > i{height:4px;flex:1;border-radius:2px;background:rgba(var(--rgb-primary-text-color),0.14)}

          ha-markdown-element > div > a > div:nth-of-type(2){display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}

          ha-markdown-element > div > a > div:nth-of-type(2) > span:first-child{display:inline-flex;align-items:center;gap:4px;padding:3px
          10px;border-radius:999px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap;color:var(--fc);background:color-mix(in
          srgb,var(--fc) 18%,transparent)}

          ha-markdown-element > div > a > div:nth-of-type(2) > span:first-child >
          ha-icon{--mdc-icon-size:14px}

          ha-markdown-element > div > a > div:nth-of-type(2) > span:last-child{font-size:12px;color:var(--secondary-text-color);white-space:nowrap}

          ha-markdown-element > div > div{display:flex;align-items:center;gap:10px;color:var(--secondary-text-color);font-size:14px}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:tag-outline"]){--fc:#9aa0a6}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:tag-outline"])
          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+1){background:var(--fc)}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:truck-fast-outline"]){--fc:#42a5f5}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:truck-fast-outline"])
          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+2){background:var(--fc)}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:truck-delivery"]){--fc:#ffa726}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:truck-delivery"])
          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+3){background:var(--fc)}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:storefront-outline"]){--fc:#ba68c8}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:storefront-outline"])
          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+3){background:var(--fc)}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:check-circle"]){--fc:#66bb6a}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:check-circle"])
          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+4){background:var(--fc)}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:keyboard-return"]){--fc:#ef5350}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:keyboard-return"])
          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+2){background:var(--fc)}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:alert-circle"]){--fc:#ef5350}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:alert-circle"])
          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+2){background:var(--fc)}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:help-circle-outline"]){--fc:#9aa0a6}

          ha-markdown-element > div > a:has(> div:nth-of-type(2) ha-icon[icon="mdi:help-circle-outline"])
          > div:nth-of-type(1) > div:last-child > i:nth-child(-n+1){background:var(--fc)}'
        .: ''
    grid_options:
      columns: full
  - type: heading
    heading: Zuletzt zugestellt
    heading_style: title
    icon: mdi:package-variant-closed-check
  - type: markdown
    content: '{% from ''pakete.jinja'' import liste, held, aktiv, zugestellt, ausgehend,
      dienst_zeile, dienst_stand, dienst_zustellung, tabelle, demo %}{{ zugestellt()
      }}'
    card_mod:
